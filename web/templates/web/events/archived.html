{% extends 'web/_base_bootstrap.html' %}
{% block title %}Event archived{% endblock %}
{% block content %}
    <div class="mb-4">
        <div class="d-flex flex-wrap gap-2 align-items-center mb-4">
            <a href="{% url 'events' %}" class="btn btn-outline-secondary btn-sm rounded-pill d-inline-flex align-items-center">
                <i class="bi bi-arrow-left me-2"></i> Back to events
            </a>
            {% if user.is_staff %}
            <a href="{% url 'admin:backoffice_event_change' event.id %}" class="btn btn-primary btn-sm rounded-pill d-inline-flex align-items-center">
                <i class="bi bi-pencil me-2"></i> Edit event
            </a>
            {% endif %}
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="fs-4 fw-medium mb-2">Event archived</h1>
                <p class="text-muted mb-0">This event has been archived and is no longer available.</p>
            </div>
        </div>
    </div>
{% endblock %}
